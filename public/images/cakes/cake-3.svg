<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='1067' viewBox='0 0 1600 1067'>
  <defs>
    <linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0%' stop-color='#ffe6d2'/>
      <stop offset='100%' stop-color='#dcf9ec'/>
    </linearGradient>
    <linearGradient id='table' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0%' stop-color='#f8e7d9'/>
      <stop offset='100%' stop-color='#e8cbb6'/>
    </linearGradient>
    <linearGradient id='cakeSide' x1='0' y1='0' x2='1' y2='0'>
      <stop offset='0%' stop-color='#fff1bf'/>
      <stop offset='100%' stop-color='#ffd079'/>
    </linearGradient>
    <radialGradient id='spot' cx='50%' cy='32%' r='70%'>
      <stop offset='0%' stop-color='rgba(255,255,255,0.9)'/>
      <stop offset='100%' stop-color='rgba(255,255,255,0)'/>
    </radialGradient>
    <filter id='softShadow' x='-40%' y='-40%' width='180%' height='180%'>
      <feDropShadow dx='0' dy='18' stdDeviation='16' flood-opacity='0.22' flood-color='#3b2b22'/>
    </filter>
    <filter id='grain'>
      <feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch' result='n'/>
      <feColorMatrix in='n' type='saturate' values='0'/>
      <feComponentTransfer>
        <feFuncA type='table' tableValues='0 0.03'/>
      </feComponentTransfer>
    </filter>
  </defs>
